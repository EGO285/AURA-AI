<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA</title>
<style>
  :root {
    --bg-0: #05060d;
    --bg-1: #0a0d1a;
    --glass: rgba(20, 24, 42, 0.55);
    --glass-strong: rgba(24, 29, 51, 0.8);
    --border: rgba(140, 160, 255, 0.14);
    --border-lit: rgba(140, 160, 255, 0.4);
    --text: #eef1fb;
    --muted: #99a2c4;
    --c1: #2dd4bf;   /* teal */
    --c2: #6c8cff;   /* blue */
    --c3: #a855f7;   /* violet */
    --c4: #ec4899;   /* pink */
    --ok: #34d399;
    --warn: #fbbf24;
    --aurora: linear-gradient(120deg, var(--c1), var(--c2) 40%, var(--c3) 70%, var(--c4));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 75% -10%, #10152e 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    color: var(--text);
    font: 15px/1.6 "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---- Fond spatial animé ---- */
  #space { position: fixed; inset: 0; z-index: 0; display: block; }
  .nebula {
    position: fixed; z-index: 0; border-radius: 50%;
    filter: blur(90px); opacity: .35; pointer-events: none;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .nebula.a { width: 460px; height: 460px; top: -120px; left: -80px;
    background: radial-gradient(circle, var(--c3), transparent 70%); }
  .nebula.b { width: 520px; height: 520px; bottom: -160px; right: -100px;
    background: radial-gradient(circle, var(--c1), transparent 70%); animation-delay: -8s; }
  .nebula.c { width: 380px; height: 380px; top: 30%; right: 20%;
    background: radial-gradient(circle, var(--c4), transparent 70%); opacity: .22; animation-delay: -14s; }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(40px, 30px) scale(1.15); }
  }
  /* glyphes spatiaux en orbite */
  .orbit { position: fixed; z-index: 0; pointer-events: none; opacity: .5; }
  .orbit svg { display: block; }
  .orbit.o1 { top: 14%; left: 8%;  animation: float1 18s ease-in-out infinite; }
  .orbit.o2 { top: 68%; left: 82%; animation: float2 22s ease-in-out infinite; }
  .orbit.o3 { top: 78%; left: 12%; animation: float1 26s ease-in-out infinite reverse; }
  @keyframes float1 { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-26px) rotate(12deg)} }
  @keyframes float2 { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(24px) rotate(-14deg)} }

  /* toute l'UI passe au-dessus du fond */
  header, main, footer { position: relative; z-index: 2; }

  /* ---- Header ---- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px;
    background: var(--glass);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--aurora); background-size: 200% 200%;
    display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff;
    box-shadow: 0 0 24px rgba(108,140,255,.5);
    animation: shimmer 6s ease infinite;
  }
  @keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  header .title-wrap { display: flex; flex-direction: column; line-height: 1.15; }
  header h1 {
    font-size: 20px; margin: 0; font-weight: 800; letter-spacing: 3px;
    background: var(--aurora); background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s ease infinite;
  }
  header .powered { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  header .powered b { color: var(--c2); font-weight: 700; }
  header .status { margin-left: auto; display: flex; gap: 8px; font-size: 12px; }
  .pill {
    padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); background: rgba(255,255,255,.03); backdrop-filter: blur(6px);
  }
  .pill.on { color: var(--ok); border-color: rgba(52,211,153,.4); box-shadow: 0 0 12px rgba(52,211,153,.2); }
  .pill.off { color: var(--warn); border-color: rgba(251,191,36,.4); }

  /* ---- Zone de chat ---- */
  main {
    flex: 1; overflow-y: auto; padding: 26px 16px 10px;
    display: flex; flex-direction: column; gap: 18px;
    max-width: 920px; width: 100%; margin: 0 auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .msg { display: flex; gap: 12px; align-items: flex-start; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .msg .avatar {
    flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .msg.user .avatar { background: rgba(108,140,255,.18); border: 1px solid var(--border); color: var(--text); }
  .msg.assistant .avatar { background: var(--aurora); background-size: 200% 200%; color: #fff; box-shadow: 0 0 18px rgba(168,85,247,.45); animation: shimmer 6s ease infinite; }
  .bubble {
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 13px 16px; border-radius: 14px; max-width: 100%;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .msg.user .bubble { background: rgba(108,140,255,.13); border-color: var(--border-lit); }
  .bubble img { max-width: 340px; border-radius: 12px; display: block; margin-top: 10px; border: 1px solid var(--border); }
  .bubble code { background: rgba(0,0,0,.4); padding: 1px 6px; border-radius: 5px; font-size: 13px; color: var(--c1); }
  .bubble pre { background: rgba(0,0,0,.45); padding: 13px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--border); }
  .attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .attachments .chip { font-size: 12px; }
  .sources { margin-top: 12px; font-size: 13px; }
  .sources > strong { color: var(--c1); }
  .sources a { color: var(--c2); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .sources .src { padding: 7px 0; border-top: 1px dashed var(--border); }
  .typing { color: var(--muted); font-style: italic; }
  .typing::after { content: '✦'; margin-left: 6px; animation: pulse 1.2s ease infinite; display: inline-block; }
  @keyframes pulse { 0%,100%{opacity:.2; transform:scale(.8)} 50%{opacity:1; transform:scale(1.2)} }

  /* ---- Écran d'accueil ---- */
  .empty { text-align: center; color: var(--muted); margin-top: 9vh; animation: rise .6s ease both; }
  .empty .halo {
    width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%;
    background: var(--aurora); background-size: 200% 200%;
    display: grid; place-items: center; font-size: 42px; font-weight: 800; color: #fff;
    box-shadow: 0 0 60px rgba(108,140,255,.55); animation: shimmer 6s ease infinite;
  }
  .empty h2 { color: var(--text); font-weight: 800; font-size: 26px; margin: 0 0 6px; letter-spacing: 1px; }
  .empty p { max-width: 460px; margin: 0 auto; }
  .empty .caps { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .empty .cap {
    background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(10px);
    padding: 10px 15px; border-radius: 12px; font-size: 13px; color: var(--text);
    transition: transform .2s, border-color .2s;
  }
  .empty .cap:hover { transform: translateY(-3px); border-color: var(--border-lit); }

  /* ---- Composer ---- */
  footer {
    padding: 12px 16px 18px;
    background: linear-gradient(to top, var(--bg-0), transparent);
  }
  .composer {
    max-width: 920px; margin: 0 auto;
    background: var(--glass-strong); border: 1px solid var(--border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 18px; padding: 12px 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 13px; color: var(--muted);
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: rgba(255,255,255,.03); user-select: none; transition: all .2s;
  }
  .toggle:hover { border-color: var(--border-lit); }
  .toggle.active { color: #fff; border-color: transparent; background-image: var(--aurora); box-shadow: 0 0 16px rgba(108,140,255,.4); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    padding: 5px 9px; border-radius: 9px; font-size: 12px; color: var(--muted);
  }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
  .chip button:hover { color: var(--c4); }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 180px;
    background: rgba(0,0,0,.25); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-color: var(--border-lit); box-shadow: 0 0 0 3px rgba(108,140,255,.12); }
  .icon-btn, .send-btn {
    border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text);
    border-radius: 12px; cursor: pointer; height: 46px; padding: 0 14px; font-size: 16px; transition: all .2s;
  }
  .icon-btn:hover { border-color: var(--border-lit); }
  .send-btn { background-image: var(--aurora); background-size: 200% 200%; border: none; color: #fff; font-weight: 700; padding: 0 20px; box-shadow: 0 0 18px rgba(108,140,255,.4); }
  .send-btn:hover { animation: shimmer 3s ease infinite; }
  .send-btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; padding-left: 2px; }

  @media (max-width: 560px) {
    header h1 { font-size: 17px; }
    .empty { margin-top: 5vh; }
    .bubble img { max-width: 100%; }
  }
</style>
</head>
<body>
  <!-- fond spatial -->
  <canvas id="space"></canvas>
  <div class="nebula a"></div>
  <div class="nebula b"></div>
  <div class="nebula c"></div>
  <div class="orbit o1"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="12" fill="none" stroke="#6c8cff" stroke-width="1.2"/><ellipse cx="27" cy="27" rx="24" ry="8" fill="none" stroke="#a855f7" stroke-width="1" transform="rotate(-20 27 27)"/><circle cx="27" cy="27" r="4" fill="#2dd4bf"/></svg></div>
  <div class="orbit o2"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="7" fill="#ec4899" opacity="0.7"/><circle cx="20" cy="20" r="15" fill="none" stroke="#6c8cff" stroke-width="1" stroke-dasharray="3 4"/></svg></div>
  <div class="orbit o3"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M4 26 L26 4 M20 4 H26 V10" fill="none" stroke="#2dd4bf" stroke-width="1.4"/><circle cx="9" cy="21" r="3" fill="#a855f7"/></svg></div>

  <header>
    <div class="logo">A</div>
    <div class="title-wrap">
      <h1>AURA</h1>
      <span class="powered">powered by <b>EGO</b></span>
    </div>
    <div class="status" id="status"></div>
  </header>

  <main id="chat">
    <div class="empty" id="empty">
      <div class="halo">A</div>
      <h2>Bonjour, je suis AURA</h2>
      <p>Pose une question, envoie une image ou un fichier, génère une image, ou explore le web en temps réel.</p>
      <div class="caps">
        <div class="cap">💬 Chat</div>
        <div class="cap">👁️ Vision</div>
        <div class="cap">📎 Fichiers</div>
        <div class="cap">🎨 Images</div>
        <div class="cap">🌐 Web</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <div class="toolbar">
        <label class="toggle" id="webToggle">🌐 Recherche web</label>
        <label class="toggle" id="imgToggle">🎨 Mode image</label>
        <input type="file" id="fileInput" multiple hidden
               accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.py,.html,.css,.xml,.log,.ts" />
        <span id="fileChips" class="attachments"></span>
      </div>
      <div class="input-row">
        <button class="icon-btn" id="attachBtn" title="Joindre un fichier">📎</button>
        <textarea id="input" placeholder="Écris ton message…  (Entrée pour envoyer · Maj+Entrée = nouvelle ligne)"></textarea>
        <button class="send-btn" id="sendBtn">Envoyer</button>
      </div>
      <div class="hint" id="hint">Mode image OFF — je réponds par du texte. Active « Mode image » pour générer une image.</div>
    </div>
  </footer>

<script>
/* ===================== FOND SPATIAL ANIMÉ ===================== */
(function () {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [], mouse = { x: -9999, y: -9999 };
  const COLORS = ['#ffffff', '#bcd0ff', '#c9a8ff', '#8ff0e6'];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.min(180, Math.floor((w * h) / 9000));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      z: Math.random() * 0.8 + 0.2,          // profondeur (parallaxe)
      r: Math.random() * 1.4 + 0.3,
      c: COLORS[(Math.random() * COLORS.length) | 0],
      tw: Math.random() * Math.PI * 2,        // phase scintillement
      vx: (Math.random() - 0.5) * 0.08,
      vy: (Math.random() - 0.5) * 0.08,
    }));
  }
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseout', () => { mouse.x = mouse.y = -9999; });

  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    // dérive + scintillement
    for (const s of stars) {
      s.x += s.vx * s.z; s.y += s.vy * s.z;
      if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
      if (s.y < 0) s.y = h; if (s.y > h) s.y = 0;
      const twinkle = 0.5 + 0.5 * Math.sin(t * 0.002 + s.tw);
      ctx.globalAlpha = (0.35 + 0.65 * twinkle) * s.z;
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * s.z, 0, Math.PI * 2);
      ctx.fill();
    }
    // constellations : lignes entre étoiles proches + vers le curseur
    ctx.globalAlpha = 1;
    for (let i = 0; i < stars.length; i++) {
      const a = stars[i];
      for (let j = i + 1; j < stars.length; j++) {
        const b = stars[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 14000) {
          ctx.strokeStyle = 'rgba(140,160,255,' + (0.10 * (1 - d2 / 14000)) + ')';
          ctx.lineWidth = 0.6;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      // lien vers la souris
      const mdx = a.x - mouse.x, mdy = a.y - mouse.y;
      const md2 = mdx * mdx + mdy * mdy;
      if (md2 < 26000) {
        ctx.strokeStyle = 'rgba(45,212,191,' + (0.28 * (1 - md2 / 26000)) + ')';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();

/* ===================== LOGIQUE DE CHAT ===================== */
const chat = document.getElementById('chat');
const empty = document.getElementById('empty');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const fileChips = document.getElementById('fileChips');
const webToggle = document.getElementById('webToggle');
const imgToggle = document.getElementById('imgToggle');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');

let history = [];
let files = [];
let webSearch = false;
let imageMode = false;
let busy = false;

fetch('/api/health').then(r => r.json()).then(h => {
  statusEl.innerHTML =
    `<span class="pill ${h.hf ? 'on' : 'off'}">HF ${h.hf ? '✓' : '✗'}</span>` +
    `<span class="pill ${h.tavily ? 'on' : 'off'}">Web ${h.tavily ? '✓' : '✗'}</span>`;
}).catch(() => {});

webToggle.onclick = () => { webSearch = !webSearch; webToggle.classList.toggle('active', webSearch); };
imgToggle.onclick = () => {
  imageMode = !imageMode;
  imgToggle.classList.toggle('active', imageMode);
  hint.textContent = imageMode
    ? 'Mode image ON — ton texte devient un prompt de génération d\'image.'
    : 'Mode image OFF — je réponds par du texte. Active « Mode image » pour générer une image.';
};

attachBtn.onclick = () => fileInput.click();
fileInput.onchange = () => { files = [...files, ...fileInput.files]; fileInput.value = ''; renderChips(); };
function renderChips() {
  fileChips.innerHTML = '';
  files.forEach((f, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${f.type.startsWith('image/') ? '🖼️' : '📄'} ${escapeHtml(f.name)} <button title="Retirer">✕</button>`;
    chip.querySelector('button').onclick = () => { files.splice(i, 1); renderChips(); };
    fileChips.appendChild(chip);
  });
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.onclick = send;

function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text && files.length === 0) return;
  if (imageMode) return generate(text);

  addMessage('user', text, files.map(f => ({ name: f.name, isImage: f.type.startsWith('image/') })));
  const sending = files;
  files = []; renderChips();
  input.value = '';

  const form = new FormData();
  form.append('message', text);
  form.append('history', JSON.stringify(history));
  form.append('webSearch', String(webSearch));
  sending.forEach(f => form.append('files', f));

  const typing = addTyping();
  setBusy(true);
  fetch('/api/chat', { method: 'POST', body: form })
    .then(r => r.json())
    .then(data => {
      typing.remove();
      if (data.error) { addMessage('assistant', '⚠️ ' + data.error); return; }
      history.push({ role: 'user', text });
      history.push({ role: 'assistant', text: data.reply });
      addMessage('assistant', data.reply, null, data.sources);
    })
    .catch(err => { typing.remove(); addMessage('assistant', '⚠️ ' + err.message); })
    .finally(() => setBusy(false));
}

function generate(prompt) {
  if (!prompt) return;
  addMessage('user', '🎨 ' + prompt);
  input.value = '';
  const typing = addTyping('Génération de l\'image…');
  setBusy(true);
  fetch('/api/generate-image', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt }),
  })
    .then(r => r.json())
    .then(data => {
      typing.remove();
      if (data.error) { addMessage('assistant', '⚠️ ' + data.error); return; }
      addMessageImage('assistant', data.image);
    })
    .catch(err => { typing.remove(); addMessage('assistant', '⚠️ ' + err.message); })
    .finally(() => setBusy(false));
}

function addMessage(role, text, attachments, sources) {
  empty.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  let inner = `<div class="avatar">${role === 'user' ? 'Moi' : 'A'}</div><div class="bubble">${renderText(text)}`;
  if (attachments && attachments.length) {
    inner += '<div class="attachments">' +
      attachments.map(a => `<span class="chip">${a.isImage ? '🖼️' : '📄'} ${escapeHtml(a.name)}</span>`).join('') +
      '</div>';
  }
  if (sources && sources.length) {
    inner += '<div class="sources"><strong>Sources</strong>' +
      sources.map((s, i) => `<div class="src">[${i + 1}] <a href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.title || s.url)}</a></div>`).join('') +
      '</div>';
  }
  inner += '</div>';
  el.innerHTML = inner;
  chat.appendChild(el);
  scroll();
  return el;
}
function addMessageImage(role, dataUrl) {
  empty.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="avatar">A</div><div class="bubble">Voici l'image générée :<img src="${dataUrl}" alt="image générée" /></div>`;
  chat.appendChild(el);
  scroll();
}
function addTyping(label = 'AURA réfléchit') {
  empty.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.innerHTML = `<div class="avatar">A</div><div class="bubble typing">${label}</div>`;
  chat.appendChild(el);
  scroll();
  return el;
}
function setBusy(b) { busy = b; sendBtn.disabled = b; sendBtn.textContent = b ? '…' : 'Envoyer'; }
function scroll() { chat.scrollTop = chat.scrollHeight; }

function renderText(text) {
  let s = escapeHtml(text || '');
  s = s.replace(/```([\s\S]*?)```/g, (_, c) => `<pre>${c}</pre>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
