# Déploiement gratuit sur Render (https://render.com)
# 1. Pousse ce dossier sur un repo GitHub
# 2. Sur Render : New > Blueprint > sélectionne ton repo
# 3. Ajoute tes variables secrètes (CHAT_API_KEY, TAVILY_API_KEY) dans l'onglet Environment
services:
  - type: web
    name: aura
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # --- secrets à renseigner dans le dashboard Render ---
      - key: CHAT_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # --- config chat (Groq gratuit par défaut) ---
      - key: CHAT_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: llama-3.1-8b-instant
      # --- images gratuites sans clé ---
      - key: IMAGE_PROVIDER
        value: pollinations
